<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Welcome to Winding River Adventures. We specialize in guided rafting tours with highly qualified and trained guides. Let us help you plan your next adventure.">
    <title>Winding River Adventures</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src=" images/rafting-compass-logo.jpg" alt="Overhead view of rafters in raft"
          width="130">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/rafting-background.webp" alt="Overhead view of rafters on a red raft ">
            <h1>Find Your Rush</h1>
            <div class="button-box">
                <a class="book" href="trips.html">Start Now!</a>
            </div>
        </div>
        <section class="triple-container">
            <figure>
                <a href="trips.html"><img class="hover-img" src="images/river-front.webp"
                      alt="River front with the mountains behind" width="200"></a>
                <figcaption>River Excursions</figcaption>
            </figure>
            <figure>
                <a href="trips.html"><img class="hover-img" src="images/camp.webp"
                      alt="Tent on a river bank" width="200"></a>
                <figcaption>Overnight Adventures</figcaption>
            </figure>
            <figure>
                <a href="trips.html"><img class="hover-img" src="images/retreats.webp"
                      alt="Group of people on a river raft" width="200"></a>
                <figcaption>Corporate Retreats</figcaption>
            </figure>
        </section>
        <div class="subscribe-banner">
            <section class="subscribe">
                <img src="images/mountain-view.webp"
                  alt="View of the mountains from a raft on the river">
                <form>
                    <p>Get our monthly Insider's Newsletter! Subscribers are automatically entered
                        into our monthly drawing for a free two-person rafting excursion!
                    </p>
                    <div class="form-item column1">
                        <label for="username">Name</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-item column1">
                        <label for="useremail">Email</label>
                        <input type="email" id="useremail" name="useremail" required>
                    </div>
                    <button type="submit">Keep Me Updated!</button>
                </form>
        </div>
        </section>
    </main>
    <footer>
        <p>&copy;2026 &#10070; Winding River Adventures &#10070; Kristi John</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.webp" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.webp" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.webp" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
