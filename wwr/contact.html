<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Winding River Adventures at: A-K 8, Cantwell, AK 99729, +1-907-555-9595, info@windingriveradventures.com">
    <meta name="author" content="Kristi John">
    <title>Contact Us: Winding River Adventures</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src=" images/rafting-compass-logo.jpg" alt="Overhead view of rafters in raft"
          width="130">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="about">
            <h1>Winding River Adventures</h1>
            <h2>A-K 8</h2>
            <h2>Cantwell, Alaska 99729</h2>
            <h2>+1 907-555-9595</h2>
            <h2><a href="mailto:info@windingriveradventures.com">info@windingriveradventures.com</a>
            </h2>
        </section>
        <div class="contact-container">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d12550.497918027153!2d-148.42140037172754!3d63.38213323615007!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1780673372519!5m2!1sen!2sus"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form>
                <div class="form-item column1">
                    <label for="username">Name</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-item column1">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
                <div class="form-item column1">
                    <label>Message Purpose</label>
                    <fieldset>
                        <div>
                            <input type="radio" id="generalinquiry" name="purpose"
                              value="generalinquiry" checked>
                            <label for="generalinquiry">General Inquiry</label>
                        </div>
                        <div>
                            <input type="radio" id="reservationquestion" name="purpose"
                              value="reservationquestion">
                            <label for="reservationquestion">Reservation Question</label>
                        </div>
                        <div>
                            <input type="radio" id="websitesuggestion" name="purpose"
                              value="websitesuggestion">
                            <label for="websitesuggestion">Website Suggestion</label>
                        </div>
                    </fieldset>
                </div>
                <div class="form-item">
                    <label for="feedback">Message </label>
                    <textarea id="feedback" name="feedback" rows="4"
                      placeholder="Type message here"></textarea>
                </div>
                <div>
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="employee-container">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/profile-bob.webp" alt="Employee Picture Bob" width="200">
                <figcaption>Bob Brown<br>Operations & Field Staff</figcaption>
            </figure>
            <figure>
                <img src="images/profile-lucy.webp" alt="Employee Picture Lucy" width="200">
                <figcaption>Lucy Holt<br>Reservations & Field Staff</figcaption>
            </figure>
            <figure>
                <img src="images/profile-sam.webp" alt="Employee Picture Sam" width="200">
                <figcaption>Sam Taylor<br>Operations & Field Staff</figcaption>
            </figure>
        </section>

    </main>
    <footer>
        <p>&copy;2026 &#10070; Winding River Adventures &#10070; Kristi John</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.webp" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.webp" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.webp" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
